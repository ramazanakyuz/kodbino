<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kodbino — Kodlamayı Keşfet!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ══ GENEL AYARLAR ══ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', sans-serif;
  background: #f0f4ff;
  color: #1a1f6e;
  overflow-x: hidden;
}

/* ══ HERO SECTION ══ */
.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  max-width: 1200px;
  margin: 0 auto;
  padding: 80px 40px;
  align-items: center;
  min-height: 100vh;
}

.hero-text h1 {
  font-size: 4rem;
  font-weight: 900;
  line-height: 1;
  margin-bottom: 20px;
}
.hero-text span { display: block; }
.text-purple { color: #7B61FF; }
.text-green { color: #22c55e; }
.hero-sub { font-size: 1.2rem; color: #6b7280; margin-bottom: 30px; }

/* ══ ANİMASYON SAHNESİ ══ */
.stage {
  position: relative;
  width: 100%;
  height: 500px;
  background: white;
  border-radius: 40px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.1);
  overflow: hidden;
  border: 4px solid #fff;
}

/* 🤖 KLASİK ROBOT TASARIMI 🤖 */
.classic-robot {
  position: absolute;
  bottom: 50px;
  left: -150px; /* Dışarıdan başlar */
  width: 120px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: robotWorkflow 12s infinite ease-in-out;
}

/* Robot Parçaları */
.r-head { width: 60px; height: 50px; background: #d1d5db; border: 3px solid #9ca3af; border-radius: 10px; position: relative; }
.r-eye { width: 12px; height: 12px; background: #1a1f3c; border-radius: 50%; position: absolute; top: 15px; animation: eyeGlow 12s infinite; }
.eye-l { left: 10px; } .eye-r { right: 10px; }
.r-antenna { width: 4px; height: 15px; background: #9ca3af; position: absolute; top: -15px; left: 28px; }
.r-antenna::after { content: ''; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; position: absolute; top: -8px; left: -3px; }

.r-body { width: 80px; height: 70px; background: #e5e7eb; border: 3px solid #9ca3af; border-radius: 8px; margin-top: 5px; position: relative; display: flex; justify-content: center; align-items: center; }
.r-panel { width: 40px; height: 20px; background: #1a1f3c; border-radius: 4px; }

.r-arm { width: 12px; height: 40px; background: #9ca3af; position: absolute; top: 10px; border-radius: 6px; transform-origin: top center; }
.arm-l { left: -15px; animation: armMoveL 12s infinite; }
.arm-r { right: -15px; animation: armMoveR 12s infinite; }

.r-base { width: 90px; height: 20px; background: #4b5563; border-radius: 10px; margin-top: 5px; }

/* 🧩 SCRATCH BLOKLARI 🧩 */
.blocks-container {
  position: absolute;
  left: 50%;
  top: 150px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.block {
  width: 160px;
  padding: 12px;
  color: white;
  font-weight: 900;
  font-size: 0.9rem;
  margin-bottom: 2px;
  opacity: 0;
  text-align: center;
  clip-path: polygon(0% 0%, 15px 0%, 20px 6px, 40px 6px, 45px 0%, 100% 0%, 100% 100%, 45px 100%, 40px 106%, 20px 106%, 15px 100%, 0% 100%);
}

.b1 { background: #FFAB19; animation: blockAppear 12s infinite 3s; }
.b2 { background: #4C97FF; animation: blockAppear 12s infinite 4s; }
.b3 { background: #0FBD8C; animation: blockAppear 12s infinite 5s; }

/* 🚀 BÜYÜK FİNAL: ROKET 🚀 */
.final-rocket {
  position: absolute;
  bottom: -300px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 8rem;
  z-index: 20;
  animation: rocketLaunch 12s infinite;
}

.success-msg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  opacity: 0;
  z-index: 30;
  animation: showText 12s infinite;
}
.success-msg h2 { font-size: 2.5rem; color: #7B61FF; text-shadow: 0 4px 10px rgba(0,0,0,0.1); }

/* ══ ANİMASYON KEYFRAMES ══ */

/* Robotun İş Akışı */
@keyframes robotWorkflow {
  0% { left: -150px; bottom: 50px; opacity: 1; } /* Giriş */
  15%, 25% { left: 50%; transform: translateX(-50%); bottom: 50px; } /* Ortada durur */
  30%, 60% { bottom: 50px; } /* Blokları inşa eder */
  70% { bottom: 70px; transform: translateX(-50%) scale(1.1); } /* Birleştirme zıplaması */
  80% { bottom: 100px; opacity: 0; } /* Rokete biniş/kayboluş */
  100% { opacity: 0; }
}

/* Blokların Sırayla Gelmesi */
@keyframes blockAppear {
  0%, 20% { opacity: 0; transform: translateY(-30px); }
  30%, 65% { opacity: 1; transform: translateY(0); }
  75%, 100% { opacity: 0; transform: scale(0); }
}

/* Roket Fırlatma */
@keyframes rocketLaunch {
  0%, 75% { bottom: -300px; opacity: 0; }
  80% { bottom: 50px; opacity: 1; }
  90% { bottom: 600px; opacity: 1; }
  100% { bottom: 800px; opacity: 0; }
}

/* Yazı Görünümü */
@keyframes showText {
  0%, 85% { opacity: 0; transform: translate(-50%, -40%); }
  90%, 98% { opacity: 1; transform: translate(-50%, -50%); }
  100% { opacity: 0; }
}

/* Kolların Hareketi */
@keyframes armMoveL {
  0%, 25% { transform: rotate(0); }
  30%, 60% { transform: rotate(110deg); }
}
@keyframes armMoveR {
  0%, 25% { transform: rotate(0); }
  30%, 60% { transform: rotate(-110deg); }
}

/* Göz Parlaması */
@keyframes eyeGlow {
  0%, 65% { background: #1a1f3c; box-shadow: none; }
  70%, 80% { background: #22c55e; box-shadow: 0 0 15px #22c55e; }
}

/* Responsive */
@media(max-width: 900px) {
  .hero { grid-template-columns: 1fr; padding: 40px 20px; text-align: center; }
  .hero-text h1 { font-size: 3rem; }
  .stage { height: 400px; }
}
</style>
</head>
<body>

<section class="hero">
  <!-- Sol Taraf: Metinler -->
  <div class="hero-text">
    <h1>
      <span>Hayal Et,</span>
      <span class="text-purple">Kodla,</span>
      <span class="text-green">Geliştir!</span>
    </h1>
    <p class="hero-sub">Geleceğin teknolojisini bugünden öğrenmeye başla. Kodbino ile eğlenceli dersler seni bekliyor!</p>
    <div style="display:flex; gap:15px; justify-content: inherit;">
        <button style="padding: 15px 30px; border-radius: 50px; border:none; background:#7B61FF; color:white; font-weight:bold; cursor:pointer; box-shadow: 0 10px 20px rgba(123,97,255,0.3);">🚀 Derse Başla</button>
    </div>
  </div>

  <!-- Sağ Taraf: Animasyon Sahnesi -->
  <div class="hero-right">
    <div class="stage">
      
      <!-- Klasik Robot -->
      <div class="classic-robot">
        <div class="r-head">
          <div class="r-antenna"></div>
          <div class="r-eye eye-l"></div>
          <div class="r-eye eye-r"></div>
        </div>
        <div class="r-body">
          <div class="r-arm arm-l"></div>
          <div class="r-arm arm-r"></div>
          <div class="r-panel"></div>
        </div>
        <div class="r-base"></div>
      </div>

      <!-- Kod Blokları -->
      <div class="blocks-container">
        <div class="block b1">✨ Hayal Et</div>
        <div class="block b2">💻 Kodla</div>
        <div class="block b3">🛠️ Geliştir</div>
      </div>

      <!-- Roket Finali -->
      <div class="final-rocket">🚀</div>

      <!-- Başarı Mesajı -->
      <div class="success-msg">
        <h2>HARİKA İŞ!</h2>
        <p style="font-weight: 800; color: #6b7280;">Kendi Geleceğini Kodladın!</p>
      </div>

    </div>
  </div>
</section>

</body>
</html>
