<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kodbino Animasyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: #f8faff;
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Sahne */
        .stage {
            position: relative;
            width: 600px;
            height: 400px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            border: 2px solid #eee;
        }

        /* --- KODBİNO ROBOT --- */
        .robot {
            position: absolute;
            width: 80px;
            height: 100px;
            left: 260px;
            top: 50px;
            z-index: 10;
            animation: robotMasterMove 9s infinite ease-in-out;
        }

        .robot-body {
            fill: #f8f8f8;
            stroke: #ddd;
            stroke-width: 1;
        }

        /* Kollar */
        .arm {
            width: 10px;
            height: 30px;
            background: #FF8A1F;
            position: absolute;
            top: 45px;
            border-radius: 5px;
            transform-origin: top center;
        }
        .arm-left { left: -5px; animation: grabLeft 9s infinite; }
        .arm-right { right: -5px; animation: grabRight 9s infinite; }

        /* --- SCRATCH BLOKLARI --- */
        .block {
            position: absolute;
            color: white;
            font-size: 0.9rem;
            padding: 10px 15px;
            min-width: 140px;
            display: flex;
            align-items: center;
            gap: 8px;
            /* Scratch Formu */
            clip-path: polygon(
                0% 0%, 15px 0%, 20px 6px, 40px 6px, 45px 0%, 100% 0%, 
                100% 100%, 45px 100%, 40px 106%, 20px 106%, 15px 100%, 0% 100%
            );
        }

        .input-circle {
            background: white;
            color: #333;
            border-radius: 10px;
            padding: 0 6px;
            font-size: 0.7rem;
        }

        /* Başlangıç Pozisyonları ve Renkler */
        #block1 { background: #FFAB19; left: 50px; top: 300px; animation: pickBlock1 9s infinite; }
        #block2 { background: #4C97FF; left: 400px; top: 300px; animation: pickBlock2 9s infinite; }
        #block3 { background: #0FBD8C; left: 225px; top: 320px; animation: pickBlock3 9s infinite; }

        /* --- ANİMASYONLAR --- */

        /* Robotun Tüm Hareket Senaryosu */
        @keyframes robotMasterMove {
            0%   { transform: translate(0, 0); }
            /* 1. Bloğa git (Hayal Et) */
            10%  { transform: translate(-180px, 180px); } 
            15%  { transform: translate(-180px, 180px); }
            /* Merkeze bırak */
            25%  { transform: translate(0, 100px); }
            30%  { transform: translate(0, 100px); }
            /* 2. Bloğa git (Kodla) */
            40%  { transform: translate(170px, 180px); }
            45%  { transform: translate(170px, 180px); }
            /* Merkeze diz */
            55%  { transform: translate(0, 142px); }
            60%  { transform: translate(0, 142px); }
            /* 3. Bloğa git (Geliştir) */
            70%  { transform: translate(-10px, 200px); }
            75%  { transform: translate(-10px, 200px); }
            /* En alta diz */
            85%  { transform: translate(0, 184px); }
            95%  { transform: translate(0, 0); }
            100% { transform: translate(0, 0); }
        }

        /* Blok 1 Taşıma */
        @keyframes pickBlock1 {
            0%, 10% { transform: translate(0,0); }
            25%, 100% { transform: translate(180px, -115px); }
        }

        /* Blok 2 Taşıma */
        @keyframes pickBlock2 {
            0%, 40% { transform: translate(0,0); }
            55%, 100% { transform: translate(-175px, -157px); }
        }

        /* Blok 3 Taşıma */
        @keyframes pickBlock3 {
            0%, 70% { transform: translate(0,0); }
            85%, 100% { transform: translate(5px, -215px); }
        }

        /* Kol Tutma Hareketi */
        @keyframes grabLeft {
            0%, 8%, 15%, 38%, 45%, 68%, 75% { transform: rotate(0); }
            10%, 40%, 70% { transform: rotate(40deg); } /* Yakalarken */
            20%, 50%, 80% { transform: rotate(20deg); } /* Taşırken */
        }
        @keyframes grabRight {
            0%, 8%, 15%, 38%, 45%, 68%, 75% { transform: rotate(0); }
            10%, 40%, 70% { transform: rotate(-40deg); }
            20%, 50%, 80% { transform: rotate(-20deg); }
        }

        /* Alt Yazı Efekti */
        .status-text {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #7B61FF;
            font-size: 1.2rem;
            opacity: 0;
            animation: textStatus 9s infinite;
        }
        @keyframes textStatus {
            10%, 25% { opacity: 1; content: "Hayal Ediliyor..."; }
            40%, 55% { opacity: 1; content: "Kodlar Yazılıyor..."; }
            70%, 85% { opacity: 1; content: "Gelecek Geliştiriliyor!"; }
        }
    </style>
</head>
<body>

<div class="stage">
    <!-- Robot -->
    <div class="robot">
        <div class="arm arm-left"></div>
        <div class="arm arm-right"></div>
        <svg viewBox="0 0 44 44">
            <ellipse cx="22" cy="4" rx="4" ry="6" fill="#74C043" />
            <rect x="7" y="11" width="30" height="22" rx="9" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
            <rect x="10" y="14" width="24" height="16" rx="6" fill="#1a1f3c"/>
            <circle cx="15" cy="19" r="2" fill="#4C8DFF"/>
            <circle cx="26" cy="19" r="2" fill="#4C8DFF"/>
            <path d="M16 26 Q22 30 28 26" stroke="#4C8DFF" stroke-width="1.5" fill="none"/>
        </svg>
    </div>

    <!-- Bloklar -->
    <div class="block" id="block1">
        hayal et <span class="input-circle">✨</span>
    </div>

    <div class="block" id="block2">
        kodla <span class="input-circle">10</span> adım
    </div>

    <div class="block" id="block3">
        geliştir <span class="input-circle">🚀</span>
    </div>

    <div class="status-text" id="label">Kodbino İş Başında!</div>
</div>

<script>
    const label = document.getElementById('label');
    const texts = [
        "", 
        "Önce Hayal Et...", 
        "Sonra Kodla...", 
        "Ve Geliştir!", 
        "Harika Bir Proje!"
    ];
    
    // Animasyon saniyelerine göre metni değiştiren basit bir timer
    setInterval(() => {
        const sec = Math.floor((Date.now() / 1000) % 9);
        if(sec < 2) label.innerText = "Hadi Başlayalım!";
        else if(sec < 4) label.innerText = "Hayal Et...";
        else if(sec < 6) label.innerText = "Kodla...";
        else if(sec < 8) label.innerText = "Geliştir!";
        else label.innerText = "Başardın! 🚀";
    }, 500);
</script>

</body>
</html>
