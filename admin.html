<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Kodbino — Hayal Et, Kodla, Geliştir!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* (CSS kısmı aynen önceki halinde, uzun olduğu için tekrar yazmıyorum, bir önceki index.html'deki CSS aynen burada olacak) */
/* Not: Buraya önceki index.html'deki tüm CSS'i kopyalayın. Aşağıda sadece JS değişecek. */
</style>
</head>
<body>
<!-- Aynı header, hero, discover vs. içerik (değişmedi) -->
<!-- ... -->

<script>
// Aynı önceki yardımcı fonksiyonlar, CC nesnesi, kartsGoster vs.
// SADECE acModal FONKSİYONU DEĞİŞTİ (yeni alanları göster)

function acModal(id, veri){
  const c = CC[id] || {r:'#7B61FF',isim:id};
  let adimHTML='';
  if(veri.adimlar?.length) adimHTML=`<div class="modal-sec"><div class="modal-sec-lbl">📌 Adım Adım</div><div class="step-list">${veri.adimlar.map((a,i)=>`<div class="step-item"><span class="step-num" style="color:${c.r}">${i+1}.</span><span>${esc(a)}</span></div>`).join('')}</div></div>`;
  let vidHTML='';
  if(veri.video_embed) vidHTML=`<div class="modal-sec"><div class="modal-sec-lbl">🎬 Video Anlatım</div><div class="modal-video"><iframe src="${veri.video_embed}" allowfullscreen loading="lazy"></iframe></div></div>`;
  let resimHTML = '';
  if(veri.resim) resimHTML = `<div class="modal-sec"><div class="modal-sec-lbl">🖼️ Görsel</div><img src="${veri.resim}" style="max-width:100%; border-radius:16px; margin-top:8px;"></div>`;
  let htmlIcerikHTML = '';
  if(veri.html_icerik) htmlIcerikHTML = `<div class="modal-sec"><div class="modal-sec-lbl">🎮 İnteraktif Oyun / Uygulama</div><div class="html-content" style="background:#f5f5f5; border-radius:12px; padding:16px; overflow-x:auto;">${veri.html_icerik}</div></div>`;
  let oyunLinkHTML = '';
  if(veri.oyun_link) oyunLinkHTML = `<div class="modal-sec"><div class="modal-sec-lbl">🔗 Oyun Bağlantısı</div><a href="${veri.oyun_link}" target="_blank" class="modal-lbtn" style="background:#f59e0b">🎮 Oyunu Aç</a></div>`;
  const ll=[];
  if(veri.scratch_link) ll.push(`<a class="modal-lbtn" style="background:${c.r}" href="${veri.scratch_link}" target="_blank">🐱 Scratch'te Aç</a>`);
  if(veri.tinkercad_link) ll.push(`<a class="modal-lbtn" style="background:${c.r}" href="${veri.tinkercad_link}" target="_blank">🔧 Tinkercad'de Aç</a>`);
  if(veri.wokwi_link) ll.push(`<a class="modal-lbtn" style="background:${c.r}" href="${veri.wokwi_link}" target="_blank">⚡ Wokwi'de Aç</a>`);
  if(veri.pdf_link) ll.push(`<a class="modal-lbtn" style="background:${c.r}" href="${veri.pdf_link}" download>📄 PDF İndir</a>`);
  const lHTML=ll.length?`<div class="modal-sec"><div class="modal-sec-lbl">🔗 Bağlantılar</div><div class="modal-links">${ll.join('')}</div></div>`:'';
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-eyebrow" style="color:${c.r}">${c.isim}</div>
    <h2>${esc(veri.baslik)}</h2>
    <p class="modal-sub">${esc(veri.kisa_aciklama)}</p>
    ${resimHTML}
    <div class="modal-sec"><div class="modal-sec-lbl">📖 Konu Anlatımı</div><div class="body" style="line-height:1.7;">${veri.konu_anlatimi}</div></div>
    ${adimHTML}
    ${vidHTML}
    ${htmlIcerikHTML}
    ${oyunLinkHTML}
    ${lHTML}
  `;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
// Diğer fonksiyonlar (kartsGoster, bolumListesiAc, vs.) aynen kalır.
</script>
</body>
</html>
